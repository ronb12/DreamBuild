    <!-- Critical CSS inline -->
    <style>
      /* Critical CSS for initial render */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
        line-height: 1.6;
        color: #333;
        background: #f8fafc;
      }
      
      #root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      
      .loading-spinner {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #0f172a; /* slate-900 */
        color: #e2e8f0; /* slate-200 */
        font-family: monospace;
        font-size: 1rem;
      }
      
      .loading-spinner div {
        border: 4px solid #646cff; /* primary color */
        border-top-color: transparent;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
    <script>
      // Must run before Vite's production module entry, which is injected into <head>.
      window.globalThis = window.globalThis || window;
      window.global = window.global || window;
      window.self = window.self || window;
      if (!window.Request && typeof Request !== 'undefined') window.Request = Request;
      if (!window.Headers && typeof Headers !== 'undefined') window.Headers = Headers;
      if (!window.Response && typeof Response !== 'undefined') window.Response = Response;
      if (!window.fetch && typeof fetch !== 'undefined') window.fetch = fetch.bind(window);
      window.__dreambuildBootError = null;
      window.__showDreamBuildBootError = function(error) {
        window.__dreambuildBootError = error;
        var root = document.getElementById('root');
        if (!root) return;
        var message = error && (error.stack || error.message || String(error));
        root.innerHTML = '<div style="min-height:100vh;background:#0f172a;color:#e2e8f0;padding:32px;font-family:monospace;white-space:pre-wrap;"><h1 style="font-size:22px;margin-bottom:12px;">DreamBuild could not finish loading</h1><p style="margin-bottom:16px;color:#bfdbfe;">The app shell loaded, but the React bundle reported a startup error.</p><pre style="background:#020617;border:1px solid #334155;border-radius:12px;padding:16px;overflow:auto;">' + String(message || 'Unknown startup error').replace(/[&<>]/g, function(char) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[char]; }) + '</pre></div>';
      };
      window.addEventListener('error', function(event) {
        window.__showDreamBuildBootError(event.error || event.message);
      });
      window.addEventListener('unhandledrejection', function(event) {
        window.__showDreamBuildBootError(event.reason || 'Unhandled promise rejection');
      });
    </script>
  </head>
  <body>
    <div id="root">
      <div class="loading-spinner">
        <div></div>
        <p style="margin-left: 10px;">Loading DreamBuild...</p>
      </div>
    </div>
    
    <!-- Clear old service workers/caches so the live app does not get trapped in a stale loading shell. -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.getRegistrations()
            .then(registrations => Promise.all(registrations.map(registration => registration.unregister())))
            .catch(error => console.warn('DreamBuild SW cleanup skipped:', error));
        });
      }
      if ('caches' in window) {
        caches.keys()
          .then(keys => Promise.all(keys.map(key => caches.delete(key))))
          .catch(error => console.warn('DreamBuild cache cleanup skipped:', error));
      }
    </script>
    
    <!-- Comprehensive polyfills for essential APIs -->
    <script>
      // Loading comprehensive polyfills...
      
      // CRITICAL: Ensure global objects exist FIRST and IMMEDIATELY
      if (typeof globalThis === 'undefined') {
        window.globalThis = window;
      }
      if (typeof global === 'undefined') {
        window.global = window;
      }
      if (typeof self === 'undefined') {
        window.self = window;
      }
      
      // CRITICAL: Make sure Request, Headers, Response are available IMMEDIATELY
      // This prevents any destructuring errors from occurring
      if (!window.Request) {
        window.Request = class Request {
          constructor(input, init = {}) {
            this.url = input;
            this.method = init.method || 'GET';
            this.headers = new Headers(init.headers || {});
            this.body = init.body;
          }
        };
      }
      
      if (!window.Headers) {
        window.Headers = class Headers {
          constructor(init = {}) {
            this._headers = {};
            if (init) {
              Object.entries(init).forEach(([key, value]) => {
                this._headers[key.toLowerCase()] = value;
              });
            }
          }
          get(name) { return this._headers[name.toLowerCase()]; }
          set(name, value) { this._headers[name.toLowerCase()] = value; }
          has(name) { return name.toLowerCase() in this._headers; }
        };
      }
      
      if (!window.Response) {
        window.Response = class Response {
          constructor(body, init = {}) {
            this.body = body;
            this.status = init.status || 200;
            this.statusText = init.statusText || 'OK';
            this.headers = new Headers(init.headers || {});
            this.ok = this.status >= 200 && this.status < 300;
          }
          async json() { return JSON.parse(this.body); }
          async text() { return this.body; }
        };
      }
      
      if (!window.fetch) {
        window.fetch = async function(url, options = {}) {
          const xhr = new XMLHttpRequest();
          return new Promise((resolve, reject) => {
            xhr.open(options.method || 'GET', url);
            if (options.headers) {
              Object.entries(options.headers).forEach(([key, value]) => {
                xhr.setRequestHeader(key, value);
              });
            }
            xhr.onload = function() {
              resolve(new window.Response(xhr.responseText, {
                status: xhr.status,
                statusText: xhr.statusText,
                headers: xhr.getAllResponseHeaders()
              }));
            };
            xhr.onerror = function() { reject(new Error('Network error')); };
            xhr.send(options.body);
          });
        };
      }
      
      // Make sure all APIs are available on ALL global objects IMMEDIATELY
      const webAPIs = { Request: window.Request, Headers: window.Headers, Response: window.Response, fetch: window.fetch };
      Object.entries(webAPIs).forEach(([name, api]) => {
        if (api) {
          if (typeof globalThis !== 'undefined') globalThis[name] = api;
          if (typeof global !== 'undefined') global[name] = api;
          if (typeof self !== 'undefined') self[name] = api;
          if (typeof window !== 'undefined') window[name] = api;
        }
      });
      
      console.log('✅ Essential APIs loaded immediately:', {
        Request: !!window.Request,
        Headers: !!window.Headers,
        Response: !!window.Response,
        fetch: !!window.fetch
      });
      
      // Final verification
      console.log('✅ Final verification: APIs ready for modules');
    </script>
    
    <!-- Global Error Handler to catch destructuring errors early -->
    <script>
      window.addEventListener('error', function(event) {
        if (event.message.includes("Cannot destructure property 'Request' of 'undefined'")) {
          console.error('🚨 DESTRUCTURING ERROR DETECTED!');
          console.error('Stack: ', event.error ? event.error.stack : 'No stack available');
          event.preventDefault(); // Prevent default handling to avoid further console spam
        }
      });
      
      // Also catch unhandled promise rejections
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && event.reason.message && event.reason.message.includes("Cannot destructure property 'Request' of 'undefined'")) {
          console.error('🚨 DESTRUCTURING ERROR DETECTED (Unhandled Rejection)!');
          console.error('Stack: ', event.reason.stack || 'No stack available');
          event.preventDefault();
        }
      });
      
      console.log('🛡️ Global error handler: Ensuring APIs are available...');
      
      // Final verification that APIs are globally available
      if (!window.Request || !window.Headers || !window.Response || !window.fetch) {
        console.error('❌ Final verification failed: Core APIs are NOT available globally after polyfills.');
      } else {
        console.log('✅ Final verification: APIs ready for modules');
      }
    </script>
    
    <script type="module" src="/src/main.jsx"></script>
  </body>
